[project]
name = "tripwire-backend"
version = "0.1.0"
description = "Tripwire backend: Hyperliquid TESTNET feed, glasses HUD WebSocket, Telegram Business bot"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # Pinned exactly: the adapter depends on this SDK's WebsocketManager internals.
    "hyperliquid-python-sdk==0.24.0",
    "python-telegram-bot>=21.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tripwire"]

[[tool.mypy.overrides]]
module = ["hyperliquid.*", "eth_account.*"]
ignore_missing_imports = true
